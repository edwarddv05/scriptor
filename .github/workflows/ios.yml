# Builds an unsigned .ipa on a GitHub macOS runner (no Mac or paid Apple account needed).
# Sign and install it with Sideloadly or AltStore using a free Apple ID.
name: iOS IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Release = app standalone. Debug = dev client que carga el código desde tu PC (npx expo start).'
        type: choice
        options: [Release, Debug]
        default: Release
  push:
    branches: [main]
    paths-ignore: ['**.md']

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: npm ci

      - name: Regenerate prelude and editor bundle
        run: |
          npm run prelude
          npm run editor
          npm run test:prelude

      - name: Prebuild native project
        run: npx expo prebuild --platform ios --clean

      - name: Build app (unsigned)
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          set -o pipefail
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E '(error|warning: .*ScriptEngine|BUILD (SUCCEEDED|FAILED))' || (tail -200 build.log; exit 1)

      - name: Package .ipa
        run: |
          APP=$(ls -d build/Build/Products/${CONFIGURATION}-iphoneos/*.app | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "Scriptor-${CONFIGURATION}.ipa" Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Scriptor-${{ env.CONFIGURATION }}-ipa
          path: Scriptor-*.ipa
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
